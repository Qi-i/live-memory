name: Tighten adaptive wall height

on:
  push:
    branches:
      - feat/share-studio-adaptive-layout-20260916

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/share-studio-adaptive-layout-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Tighten adaptive wall canvas
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/shareStudio.tsx')
          text = path.read_text(encoding='utf-8')
          old = '    const minHeight = landscape ? 820 : 1500;'
          new = '    const minHeight = landscape ? Math.round(width * 0.425) : Math.round(width * 1.12);'
          if old not in text:
              raise SystemExit('adaptive min-height target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify code
        run: npm run check
      - name: Remove temporary workflow
        run: rm .github/workflows/fix-adaptive-wall-height.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: tighten smart wall canvas height"
          git push origin HEAD:feat/share-studio-adaptive-layout-20260916
