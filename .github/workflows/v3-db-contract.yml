name: Verify V3 server CAS in isolated PostgreSQL

on:
  push:
    branches:
      - refactor/core-v3-architecture-20261108
  pull_request:
    branches: [main, refactor/core-v3-architecture-20261108]
    paths:
      - "tests/db/**"
      - "src/core/**"
      - "src/infrastructure/supabase/**"
      - ".github/workflows/v3-db-contract.yml"

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: v3_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v3_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGPASSWORD: ephemeral-test-only
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: v3_contract
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Apply isolated schema and V3 CAS procedures
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/v3_cas_fixture.sql
      - name: Verify actual PostgreSQL RLS, CAS and V2-update compatibility
        run: psql -X -v ON_ERROR_STOP=1 -f tests/db/v3_cas_contract_checks.sql
      - name: Verify no real remote database was configured
        run: |
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "v3_contract"
          echo "All SQL executed only against temporary job-local PostgreSQL 17."
