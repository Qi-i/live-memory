name: Migrate poster density

on:
  push:
    branches: [fix/poster-themes-admin-v3]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[density-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/poster-themes-admin-v3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/migrate-poster-density.mjs
      - run: npm run check
      - name: Commit density migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/archive.tsx scripts/visual-audit.mjs
          git commit -m "Migrate desktop poster density to five columns [density-migrated]"
          git push origin HEAD:fix/poster-themes-admin-v3
