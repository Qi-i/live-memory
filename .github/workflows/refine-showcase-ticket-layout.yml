name: Refine showcase and ticket layout

on:
  push:
    branches:
      - feat/share-ticket-sync-map-redesign-20260916
    paths:
      - scripts/refine-showcase-ticket-layout.py
      - .github/workflows/refine-showcase-ticket-layout.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/share-ticket-sync-map-redesign-20260916
          fetch-depth: 0
      - run: python scripts/refine-showcase-ticket-layout.py
      - run: rm scripts/refine-showcase-ticket-layout.py .github/workflows/refine-showcase-ticket-layout.yml
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: balance showcase and ticket rows"
          git push origin HEAD:feat/share-ticket-sync-map-redesign-20260916
