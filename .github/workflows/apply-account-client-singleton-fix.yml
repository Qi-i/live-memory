name: Apply account client singleton fix

on:
  push:
    branches:
      - fix/account-session-persistence-20260916
    paths:
      - scripts/apply-account-client-singleton-fix.py
      - .github/workflows/apply-account-client-singleton-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/account-session-persistence-20260916
      - run: python scripts/apply-account-client-singleton-fix.py
      - run: rm scripts/apply-account-client-singleton-fix.py .github/workflows/apply-account-client-singleton-fix.yml
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/supabase.ts src/adminApi.ts scripts/account-session-persistence-tests.mjs package.json .github/workflows scripts || true
          git commit -m "fix: preserve account session with a single auth client"
          git push origin HEAD:fix/account-session-persistence-20260916
