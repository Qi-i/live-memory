name: Supabase Keepalive

on:
  schedule:
    # Four independent user-database reads per day. Spreading them across the day
    # is more representative of ongoing activity than a burst of requests once daily.
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/supabase-keepalive.yml'
      - 'supabase/migrations/011_project_activity_probe.sql'

permissions:
  contents: read

concurrency:
  group: supabase-keepalive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keepalive:
    name: Keep account Supabase active
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SUPABASE_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Read the database activity probe
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_KEY:-}" ]; then
            echo "Supabase repository variables are not configured." >&2
            exit 1
          fi

          endpoint="${SUPABASE_URL%/}/rest/v1/project_activity_probe?select=id&id=eq.1&limit=1"
          headers=(
            -H "apikey: ${SUPABASE_KEY}"
            -H "Accept: application/json"
            -H "x-client-info: github-actions-supabase-keepalive/${GITHUB_RUN_ID}"
          )
          if [[ "${SUPABASE_KEY}" == eyJ* ]]; then
            headers+=(-H "Authorization: Bearer ${SUPABASE_KEY}")
          fi

          http_code="$(curl \
            --silent --show-error --location \
            --retry 3 --retry-delay 2 --retry-all-errors \
            --connect-timeout 15 --max-time 30 \
            --output /tmp/supabase-keepalive-response.txt --write-out '%{http_code}' \
            "${headers[@]}" \
            "${endpoint}")"

          case "${http_code}" in
            2*) ;;
            *)
              echo "Supabase database activity probe failed (${http_code})." >&2
              cat /tmp/supabase-keepalive-response.txt >&2
              exit 1
              ;;
          esac

          if ! grep --fixed-strings --quiet '"id":1' /tmp/supabase-keepalive-response.txt; then
            echo "Supabase activity probe returned an unexpected body:" >&2
            cat /tmp/supabase-keepalive-response.txt >&2
            exit 1
          fi

          echo "Supabase user-table read succeeded (${http_code})."
          echo "### Supabase keepalive" >> "$GITHUB_STEP_SUMMARY"
          echo "A real PostgREST SELECT against public.project_activity_probe completed successfully." >> "$GITHUB_STEP_SUMMARY"
