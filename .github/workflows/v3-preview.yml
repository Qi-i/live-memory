name: Build V3 standalone preview

on:
  # The V3 branch now publishes a composite, SHA-checked V2 + V3 beta.
  # Keep the demo available by manual dispatch, not by triggering a
  # competing V2-only GitHub Pages deployment on every V3 commit.
  pull_request:
    branches:
      - refactor/core-v3-architecture-20261108
    paths:
      - "src/ui/system/**"
      - "scripts/v3-preview-public-smoke.mjs"
      - ".github/workflows/v3-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.ref == 'refs/heads/refactor/core-v3-architecture-20261108' || github.base_ref == 'refactor/core-v3-architecture-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify standalone preview cannot import account or private data
        run: node scripts/v3-preview-isolation-tests.mjs
      - name: Verify application type safety
        run: npm run typecheck
      - name: Build demo-only V3 UI
        run: npm run build
        env:
          VITE_V3_STANDALONE: "1"
          VITE_V3_PREVIEW: "0"
      - name: Package isolated preview
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/v3-preview.html
          test ! -f dist/index.html
          mv dist/v3-preview.html dist/index.html
          printf '{"sha":"%s","type":"demo-only","source":"refactor/core-v3-architecture-20261108"}\n' "$GITHUB_SHA" > dist/preview-info.json
          test -d dist/assets
          test -f dist/demo/zhou-shen.webp
      - name: Install browser for public preview verification
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local standalone preview
        run: |
          VITE_V3_STANDALONE=1 npm run preview -- --host 127.0.0.1 --port 4175 > /tmp/v3-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4175/live-memory/v3-preview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-preview.log
          exit 1
      - name: Verify desktop and Android public demo is interactive and isolated
        run: node scripts/v3-preview-public-smoke.mjs
      - name: Record verified browser audit in preview manifest
        shell: bash
        run: |
          node -e '
            const fs=require("node:fs");
            const file="dist/preview-info.json";
            const info=JSON.parse(fs.readFileSync(file,"utf8"));
            info.browserVerified=true;
            fs.writeFileSync(file,JSON.stringify(info));
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3-preview-visual
          path: visual-artifacts/v3-public
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: v3-static-preview
          path: dist
          if-no-files-found: error
          retention-days: 14
