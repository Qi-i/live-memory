name: Patch premium home and share redesign

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'design/premium-home-share' && !contains(github.event.pull_request.head.label, '[premium-home-share-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Qi-i/live-memory
          ref: design/premium-home-share
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-premium-home-share.mjs
      - run: npm run check
      - name: Commit redesign
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/archive.tsx src/archive.css src/main.tsx src/shareStudio.tsx src/shareStudio.css scripts/run-tests.mjs
          git commit -m "Redesign homepage and share studio [premium-home-share-applied]"
          git push origin HEAD:design/premium-home-share
