name: Validate pull request

on:
  pull_request:
    branches: [main, refactor/core-v3-architecture-20261108]
  push:
    branches: [refactor/experience-system-v3]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Build separately usable V3 real beta candidate
        if: github.head_ref == 'release/v3-isolated-usable-beta-20261111'
        run: |
          node scripts/v3-isolated-beta-tests.mjs
          npm run build
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("dist/v3-build-info.json","utf8"));
            if(p.sha!==process.env.GITHUB_SHA || p.version!=="v3-isolated-beta" ||
               p.release!==false || p.cloudWriterCutover!==false)process.exit(1);
          '
        env:
          VITE_V3_BETA: "1"
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: github.head_ref == 'release/v3-isolated-usable-beta-20261111'
        with:
          name: v3-real-beta-static-bundle
          path: dist
          retention-days: 14
          if-no-files-found: error

  visual:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install visual audit browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
          VITE_V3_PREVIEW: ${{ (github.base_ref == 'refactor/core-v3-architecture-20261108' || github.head_ref == 'refactor/core-v3-architecture-20261108') && '1' || '0' }}
          VITE_V3_REAL_WORKSPACE: ${{ github.base_ref == 'refactor/core-v3-architecture-20261108' && '1' || '0' }}
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/live-memory-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/live-memory/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-memory-preview.log
          exit 1
      - name: Capture responsive visual audit
        run: node scripts/visual-audit.mjs
        env:
          V3_PREVIEW_AUDIT: ${{ (github.base_ref == 'refactor/core-v3-architecture-20261108' || github.head_ref == 'refactor/core-v3-architecture-20261108') && '1' || '0' }}
      - name: Validate authentic read-only V3 archive, stats, cities and privacy
        if: github.base_ref == 'refactor/core-v3-architecture-20261108'
        run: node scripts/v3-real-browser-smoke.mjs
      - name: Start isolated source-module browser harness
        if: github.base_ref == 'refactor/core-v3-architecture-20261108'
        run: |
          npm run dev:local -- --port 5173 > /tmp/v3-two-device-source.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/live-memory/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/v3-two-device-source.log
          exit 1
      - name: Validate independent browser databases, sync and CAS recovery
        if: github.base_ref == 'refactor/core-v3-architecture-20261108'
        run: node scripts/v3-two-device-browser-smoke.mjs
        env:
          V3_TWO_DEVICE_URL: http://127.0.0.1:5173/live-memory/
      - name: Verify isolated V3 beta actual root page with device data and import
        if: github.head_ref == 'release/v3-isolated-usable-beta-20261111'
        run: |
          VITE_V3_BETA=1 npm run build
          npx vite preview --configLoader runner --host 127.0.0.1 --port 4176 > /tmp/v3-beta.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4176/ >/dev/null; then break; fi
            sleep 1
          done
          V3_REAL_AUDIT_URL=http://127.0.0.1:4176/ node scripts/v3-real-browser-smoke.mjs
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-memory-visual-audit
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 7
