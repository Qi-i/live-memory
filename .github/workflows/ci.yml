name: Materialize Live Memory V5

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Materialize reviewed V5 source
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/live-memory-v5.tar.gz
          for payload_part in .github/v5payload/bin*.b64; do
            base64 --decode "$payload_part" >> /tmp/live-memory-v5.tar.gz
          done
          gzip -t /tmp/live-memory-v5.tar.gz
          tar -xzf /tmp/live-memory-v5.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          main = Path('src/main.tsx')
          text = main.read_text().replace('import "./shareStudioRefinement.css";\n', '')
          main.write_text(text)

          tests = Path('scripts/run-tests.mjs')
          text = tests.read_text()
          text = text.replace('assert.match(archiveBannerCss, /object-fit:\\s*cover/);', 'assert.match(archiveBannerCss, /object-fit:\\s*contain/);')
          old = '''  assert.match(shareStudioCss, /share-preview-wall/);\n  assert.match(shareStudioCss, /share-preview-timeline/);\n  assert.match(shareStudioCss, /share-preview-magazine/);\n  assert.match(shareStudioCss, /share-preview-cities/);\n  assert.match(shareStudioCss, /aspect-ratio:\\s*4 \\/ 5/);\n  assert.match(shareStudioCss, /object-fit:\\s*cover/);'''
          new = '''  assert.match(shareStudioCss, /share-layout-canvas/);\n  assert.match(shareStudioCss, /share-coordinate-field/);\n  assert.match(shareStudioCss, /share-preview-toolbar/);\n  assert.match(shareStudioCss, /object-fit:\\s*contain/);\n  assert.match(shareStudio, /ResizeObserver/);\n  assert.match(shareStudio, /recordPosterRatio/);\n  assert.match(shareStudio, /drawContain/);\n  assert.match(shareStudio, /非地图示意/);'''
          if old not in text:
              raise SystemExit('Expected share studio assertions were not found')
          text = text.replace(old, new)
          text = text.replace('4:5 filled poster frames, category-aware newest-first sharing, four distinct layouts', 'complete poster frames, fitted preview scaling, category-aware newest-first sharing, four geometry-driven layouts')
          tests.write_text(text)
          PY
          rm -f src/shareStudioRefinement.css
          rm -rf .github/v5payload
          rm -f .github/codex-home-share-v5.md
          rm -f .github/workflows/v5-apply.yml
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
      - name: Commit materialized implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply archive and share studio V5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify materialized source
        run: |
          npm ci
          npm run check
