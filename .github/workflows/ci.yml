name: Correct mobile share visual audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Correct mobile share visual audit
        run: python .github/v5-mobile-audit.py
      - name: Restore workflow and commit source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/v5-mobile-audit.py
          git fetch origin main
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Audit mobile share preview in fixed format"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify refined source
        run: |
          npm ci
          npm run check
