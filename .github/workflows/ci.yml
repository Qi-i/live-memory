name: Validate pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/experience-system-v3]

permissions:
  contents: write

jobs:
  prepare-premium-redesign:
    if: github.event_name == 'pull_request' && github.head_ref == 'design/premium-home-share'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: design/premium-home-share
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply redesign once
        run: |
          if grep -q 'archive-highlight-card-1' src/archive.css; then
            echo 'Premium redesign already applied.'
            exit 0
          fi
          node scripts/apply-premium-home-share.mjs
          npm run check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/archive.tsx src/archive.css src/main.tsx src/shareStudio.tsx src/shareStudio.css scripts/run-tests.mjs
          git commit -m "Redesign homepage and share studio [premium-home-share-applied]"
          git push origin HEAD:design/premium-home-share

  verify:
    needs: prepare-premium-redesign
    if: always() && (needs.prepare-premium-redesign.result == 'success' || needs.prepare-premium-redesign.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

  visual:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install visual audit browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/live-memory-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/live-memory/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-memory-preview.log
          exit 1
      - name: Capture responsive visual audit
        run: node scripts/visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-memory-visual-audit
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 7
