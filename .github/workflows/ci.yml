name: Validate pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [refactor/experience-system-v3]

permissions:
  contents: write

jobs:
  refine_auth_share:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/auth-share-studio-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/auth-share-studio-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply one-shot source refinement
        run: |
          if grep -q 'const LIVE_MEMORY_PUBLIC_URL' src/supabase.ts; then
            echo 'Refinement already applied.'
            exit 0
          fi
          node scripts/refine-auth-share.mjs
      - run: npm ci
      - run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Commit verified source changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/supabase.ts src/archive.tsx src/archive.css docs/deployment.md
          git commit -m "Refine OAuth callback, archive masthead and share studio"
          git push origin HEAD:fix/auth-share-studio-v2

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

  visual:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install visual audit browser
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build application
        run: npm run build
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/live-memory-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/live-memory/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/live-memory-preview.log
          exit 1
      - name: Capture responsive visual audit
        run: node scripts/visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-memory-visual-audit
          path: visual-artifacts
          if-no-files-found: warn
          retention-days: 7
