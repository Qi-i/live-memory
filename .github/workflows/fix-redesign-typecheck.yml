name: Fix redesign typecheck

on:
  push:
    branches:
      - feat/share-ticket-sync-map-redesign-20260916
    paths:
      - scripts/fix-redesign-typecheck.py
      - .github/workflows/fix-redesign-typecheck.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/share-ticket-sync-map-redesign-20260916
          fetch-depth: 0
      - run: python scripts/fix-redesign-typecheck.py
      - run: rm scripts/fix-redesign-typecheck.py .github/workflows/fix-redesign-typecheck.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve redesign type errors"
          git push origin HEAD:feat/share-ticket-sync-map-redesign-20260916
