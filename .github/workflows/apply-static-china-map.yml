name: Apply fixed China footprint map

on:
  push:
    branches:
      - fix/static-china-footprint-map-20260916
    paths:
      - .github/workflows/apply-static-china-map.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/static-china-footprint-map-20260916
          fetch-depth: 0
      - name: Apply implementation
        shell: python
        run: |
          from pathlib import Path

          archive_path = Path('src/archive.tsx')
          archive = archive_path.read_text()
          start = archive.index('function VenueView(')
          end = archive.index('\nfunction PriceView', start)
          venue = r'''const cityCoordinateFallbacks: Record<string, [number, number]> = {
            北京: [116.4, 39.9], 上海: [121.47, 31.23], 广州: [113.27, 23.13], 深圳: [114.06, 22.54],
            成都: [104.07, 30.67], 重庆: [106.55, 29.56], 西安: [108.94, 34.34], 武汉: [114.31, 30.59],
            南京: [118.8, 32.06], 杭州: [120.16, 30.27], 苏州: [120.58, 31.3], 天津: [117.2, 39.12],
            郑州: [113.63, 34.75], 长沙: [112.94, 28.23], 青岛: [120.38, 36.07], 济南: [117.12, 36.65],
            昆明: [102.83, 25.04], 厦门: [118.09, 24.48], 福州: [119.3, 26.08], 南昌: [115.86, 28.68],
            合肥: [117.23, 31.82], 沈阳: [123.43, 41.8], 哈尔滨: [126.64, 45.76], 长春: [125.32, 43.82],
            乌鲁木齐: [87.62, 43.83], 拉萨: [91.13, 29.65], 兰州: [103.84, 36.06], 西宁: [101.78, 36.62],
            银川: [106.23, 38.49], 呼和浩特: [111.75, 40.84], 海口: [110.2, 20.04], 三亚: [109.51, 18.25],
          };

          const chinaOutlineCoordinates: Array<[number, number]> = [
            [73.5, 39.5], [75.0, 35.5], [79.0, 31.2], [82.0, 29.3], [86.0, 28.2], [89.5, 27.5],
            [92.5, 28.7], [96.0, 27.2], [99.2, 23.5], [102.5, 22.4], [105.0, 23.0], [108.1, 21.7],
            [110.2, 20.9], [113.2, 21.8], [116.1, 22.8], [119.0, 25.2], [121.2, 28.1], [121.7, 31.1],
            [122.1, 33.7], [121.0, 36.8], [122.0, 39.2], [124.5, 40.6], [128.0, 42.3], [131.0, 43.3],
            [134.3, 47.0], [131.0, 48.6], [127.4, 49.6], [123.0, 53.0], [119.0, 50.9], [114.0, 49.6],
            [110.0, 48.5], [105.0, 47.0], [101.0, 49.0], [97.0, 48.0], [93.0, 46.0], [88.0, 48.0],
            [83.0, 47.0], [79.0, 45.0], [75.0, 43.0], [73.5, 39.5],
          ];

          function projectChinaCoordinate(point: [number, number]) {
            const [lng, lat] = point;
            const x = 6 + ((lng - 73) / (135 - 73)) * 88;
            const y = 6 + ((54 - lat) / (54 - 18)) * 86;
            return {
              x: Math.max(3, Math.min(97, x)),
              y: Math.max(4, Math.min(96, y)),
            };
          }

          function footprintCoordinate(name: string, mode: "city" | "venue", records: EventRecord[]) {
            const record = records.find((item) => mode === "city"
              ? item.city === name
              : [item.city, item.venue].filter(Boolean).join(" · ") === name);
            if (!record) return undefined;
            const point: [number, number] | undefined = record.coordinates
              ? [record.coordinates.lng, record.coordinates.lat]
              : cityCoordinateFallbacks[record.city];
            return point ? projectChinaCoordinate(point) : undefined;
          }

          function VenueView({ records, onOpen }: { records: EventRecord[]; onOpen: (record: EventRecord) => void }) {
            const [mode, setMode] = useState<"city" | "venue">("city");
            const rows = mode === "city"
              ? topRows(records.map((record) => record.city).filter(Boolean), 30)
              : topRows(records.map((record) => [record.city, record.venue].filter(Boolean).join(" · ")).filter(Boolean), 30);
            const max = Math.max(1, ...rows.map(([, count]) => count));
            const outline = chinaOutlineCoordinates.map((point) => {
              const projected = projectChinaCoordinate(point);
              return `${projected.x},${projected.y}`;
            }).join(" ");
            const hainan = projectChinaCoordinate([110.2, 19.2]);

            return (
              <section className="archive-venue-view">
                <div className="venue-map-art" data-map-mode="static-china">
                  <div className="venue-map-heading"><span>MEMORY MAP</span><strong>中国固定足迹底图</strong><small>无需 API · 不可拖动缩放 · 仅作个人足迹空间示意</small></div>
                  <svg className="china-static-map" viewBox="0 0 100 100" role="img" aria-label="中国固定足迹底图" preserveAspectRatio="xMidYMid meet">
                    <defs>
                      <pattern id="china-map-grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" /></pattern>
                      <filter id="china-map-soft-shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" floodOpacity="0.12" /></filter>
                    </defs>
                    <rect className="china-map-water" x="0" y="0" width="100" height="100" rx="3" />
                    <rect className="china-map-grid" x="0" y="0" width="100" height="100" fill="url(#china-map-grid)" />
                    <polygon className="china-map-land" points={outline} filter="url(#china-map-soft-shadow)" />
                    <circle className="china-map-land china-map-island" cx={hainan.x} cy={hainan.y} r="1.55" />
                  </svg>
                  {rows.slice(0, 12).map(([name, count]) => {
                    const point = footprintCoordinate(name, mode, records);
                    if (!point) return null;
                    return <button className="venue-map-marker" key={name} type="button" style={{ "--x": `${point.x}%`, "--y": `${point.y}%`, "--weight": count } as CSSProperties} onClick={() => { const record = records.find((item) => mode === "city" ? item.city === name : [item.city, item.venue].filter(Boolean).join(" · ") === name); if (record) onOpen(record); }}><i /><b>{name}</b><em>{count}</em></button>;
                  })}
                  <div className="venue-map-legend"><span><i />到访城市 / 场馆</span><small>优先使用档案坐标；无坐标时使用内置城市中心点。</small></div>
                </div>
                <div className="venue-ranking"><header><span>足迹整理</span><h2>{mode === "city" ? "常去城市" : "常去场馆"}</h2><div><button className={mode === "city" ? "is-active" : ""} type="button" onClick={() => setMode("city")}>城市</button><button className={mode === "venue" ? "is-active" : ""} type="button" onClick={() => setMode("venue")}>场馆</button></div></header>{rows.map(([name, count]) => <p key={name} style={{ "--ratio": `${count / max * 100}%` } as CSSProperties}><span>{name}</span><i /><b>{count}</b></p>)}</div>
              </section>
            );
          }
          '''
          archive = archive[:start] + venue + archive[end:]
          archive_path.write_text(archive)

          css_path = Path('src/archive.css')
          css = css_path.read_text()
          css_start = css.index('.archive-venue-view {')
          css_end = css.index('.venue-ranking { padding: 16px; }', css_start)
          map_css = r'''.archive-venue-view { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(320px, .75fr); gap: 12px; align-items: stretch; }
          .venue-map-art { position: relative; min-height: 520px; overflow: hidden; border: 1px solid var(--experience-border); border-radius: var(--experience-radius); background: linear-gradient(145deg, #f4f8f6 0%, #e6efec 58%, #dbe8e5 100%); box-shadow: var(--experience-shadow); }
          .venue-map-heading { position: absolute; top: 18px; left: 20px; z-index: 4; display: grid; gap: 2px; padding: 10px 12px; border: 1px solid rgba(63, 94, 85, .13); border-radius: 12px; color: #20342e; background: rgba(252, 254, 252, .82); box-shadow: 0 8px 28px rgba(55, 83, 75, .08); backdrop-filter: blur(12px); }
          .venue-map-heading span { color: #5c7b72; font-size: 9px; font-weight: 950; letter-spacing: .16em; }
          .venue-map-heading strong { font-size: 15px; letter-spacing: -.02em; }
          .venue-map-heading small { color: #738b84; font-size: 9px; font-weight: 780; }
          .china-static-map { position: absolute; inset: 28px 24px 42px; width: calc(100% - 48px); height: calc(100% - 70px); pointer-events: none; }
          .china-map-water { fill: #edf5f4; }
          .china-map-grid { fill: none; stroke: rgba(80, 118, 107, .075); stroke-width: .22; }
          .china-map-land { fill: color-mix(in srgb, var(--experience-accent) 10%, #f8f5ec); stroke: #8eaaa1; stroke-width: .55; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
          .china-map-island { stroke-width: .45; }
          .venue-map-marker { position: absolute; z-index: 5; top: var(--y); left: var(--x); display: grid; grid-template-columns: 14px auto auto; gap: 5px; align-items: center; max-width: 160px; padding: 5px 7px; border: 1px solid rgba(62, 91, 82, .18); border-radius: 999px; color: #1b302a; background: rgba(255, 255, 252, .9); box-shadow: 0 6px 18px rgba(55, 84, 75, .12); backdrop-filter: blur(8px); cursor: pointer; transform: translate(-50%, -50%); }
          .venue-map-marker:hover { z-index: 7; border-color: color-mix(in srgb, var(--experience-accent-2) 45%, transparent); box-shadow: 0 8px 24px rgba(55, 84, 75, .18); }
          .venue-map-marker i { width: calc(6px + min(var(--weight), 6) * 1px); height: calc(6px + min(var(--weight), 6) * 1px); border-radius: 50%; background: var(--experience-accent-2); box-shadow: 0 0 0 5px color-mix(in srgb, var(--experience-accent-2) 17%, transparent); }
          .venue-map-marker b { overflow: hidden; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
          .venue-map-marker em { color: #387466; font-size: 10px; font-style: normal; font-weight: 950; }
          .venue-map-legend { position: absolute; right: 16px; bottom: 13px; left: 16px; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 12px; color: #607c74; font-size: 9px; font-weight: 780; }
          .venue-map-legend span { display: inline-flex; align-items: center; gap: 7px; color: #365b51; font-weight: 900; }
          .venue-map-legend span i { width: 8px; height: 8px; border-radius: 50%; background: var(--experience-accent-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--experience-accent-2) 15%, transparent); }
          .venue-map-legend small { font-size: inherit; }
          '''
          css = css[:css_start] + map_css + css[css_end:]
          css_path.write_text(css)

          settings_path = Path('src/settingsPage.tsx')
          settings = settings_path.read_text()
          settings = settings.replace('统计式足迹图无需密钥；启用在线地图时按下方指引申请浏览器端 API。', '中国固定足迹图无需密钥；启用在线地图时按下方指引申请浏览器端 API。')
          settings = settings.replace('统计式足迹图无需 API；高德或百度在线地图需要各自的浏览器端密钥。', '中国固定足迹图无需 API；高德或百度在线地图需要各自的浏览器端密钥。')
          settings = settings.replace('<option value="none">统计式足迹图（无需 API）</option>', '<option value="none">中国固定足迹图（无需 API）</option>')
          settings = settings.replace('只想看城市统计可保持“统计式足迹图”；在线底图再申请相应浏览器端密钥。', '默认使用内置中国固定底图，无需密钥；需要可拖动缩放的在线底图时再申请相应浏览器端密钥。')
          settings_path.write_text(settings)

          audit_path = Path('scripts/visual-audit.mjs')
          audit = audit_path.read_text()
          needle = '  await archiveView("列表", ".archive-list button");\n  await page.screenshot({ path: `${outputDir}/05-list-desktop.png`, fullPage: true });\n  await archiveView("海报", ".archive-poster-card");'
          replacement = '''  await archiveView("列表", ".archive-list button");
          await page.screenshot({ path: `${outputDir}/05-list-desktop.png`, fullPage: true });
          await archiveView("城市/场馆", ".archive-venue-view");
          await page.locator(".china-static-map .china-map-land").first().waitFor({ state: "visible", timeout: 10000 });
          const staticChinaMap = await page.locator(".venue-map-art").evaluate((map) => {
            const land = map.querySelector(".china-map-land");
            const rect = map.getBoundingClientRect();
            const landStyle = land ? getComputedStyle(land) : null;
            return {
              mode: map.getAttribute("data-map-mode"),
              width: rect.width,
              height: rect.height,
              landFill: landStyle?.fill || "",
              landStroke: landStyle?.stroke || "",
              markerCount: map.querySelectorAll(".venue-map-marker").length,
            };
          });
          if (staticChinaMap.mode !== "static-china" || staticChinaMap.width < 500 || staticChinaMap.height < 340 || !staticChinaMap.landFill || staticChinaMap.landFill === "rgb(16, 20, 24)" || staticChinaMap.markerCount < 1) {
            throw new Error(`Fixed China footprint map is invalid: ${JSON.stringify(staticChinaMap)}`);
          }
          await page.screenshot({ path: `${outputDir}/05b-static-china-map.png`, fullPage: true });
          await archiveView("海报", ".archive-poster-card");'''
          if needle not in audit:
            raise SystemExit('visual audit insertion point not found')
          audit = audit.replace(needle, replacement)
          audit_path.write_text(audit)
      - name: Remove temporary workflow
        run: rm .github/workflows/apply-static-china-map.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/archive.tsx src/archive.css src/settingsPage.tsx scripts/visual-audit.mjs .github/workflows/apply-static-china-map.yml
          git commit -m "fix: add static China footprint map"
          git push origin HEAD:fix/static-china-footprint-map-20260916
