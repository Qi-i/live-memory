name: Fix premium masthead cleanup

on:
  pull_request_target:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'design/premium-home-share'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Qi-i/live-memory
          ref: design/premium-home-share
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/remove-legacy-compact-masthead.mjs
      - run: npm run check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/archive.css scripts/run-tests.mjs
          git commit -m "Remove legacy compact masthead override"
          git push origin HEAD:design/premium-home-share
