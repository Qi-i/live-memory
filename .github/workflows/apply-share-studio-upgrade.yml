name: Apply share studio upgrade

on:
  push:
    branches:
      - feat/share-studio-adaptive-layout-20260916

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/share-studio-adaptive-layout-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply upgrade
        run: python scripts/apply-share-studio-upgrade.py
      - name: Install dependencies
        run: npm ci
      - name: Verify code
        run: npm run check
      - name: Remove temporary applicator
        run: rm scripts/apply-share-studio-upgrade.py .github/workflows/apply-share-studio-upgrade.yml
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: upgrade adaptive share studio and map guidance"
          git push origin HEAD:feat/share-studio-adaptive-layout-20260916
