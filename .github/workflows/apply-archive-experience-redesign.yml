name: Apply archive experience redesign

on:
  push:
    branches:
      - feat/share-ticket-sync-map-redesign-20260916
    paths:
      - scripts/apply-archive-experience-redesign.py
      - .github/workflows/apply-archive-experience-redesign.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/share-ticket-sync-map-redesign-20260916
          fetch-depth: 0
      - name: Apply approved redesign
        run: python scripts/apply-archive-experience-redesign.py
      - name: Remove temporary applicator
        run: rm scripts/apply-archive-experience-redesign.py .github/workflows/apply-archive-experience-redesign.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: redesign sharing tickets sync and maps"
          git push origin HEAD:feat/share-ticket-sync-map-redesign-20260916
