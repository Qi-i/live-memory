name: Apply Piaoxingqiu source normalization repair

on:
  push:
    branches: [fix/archive-hero-ticket-status-20260916]
    paths:
      - scripts/fix-piaoxingqiu-source.py
      - .github/workflows/apply-piaoxingqiu-source-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/archive-hero-ticket-status-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply repair
        run: python scripts/fix-piaoxingqiu-source.py
      - run: npm ci
      - name: Verify repair
        run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Commit verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f scripts/fix-piaoxingqiu-source.py .github/workflows/apply-piaoxingqiu-source-fix.yml
          git add src/domain.ts
          git commit -m "Preserve Piaoxingqiu source during normalization"
          git push origin HEAD:fix/archive-hero-ticket-status-20260916
