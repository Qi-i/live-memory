name: Patch account access mode

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Apply account and guest mode integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text.replace(old, new, 1)

          def sub_once(pattern, replacement, label):
              global text
              text2, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              text = text2

          replace_once(
              'import { withoutLocalMedia } from "./syncModel";\n',
              'import { withoutLocalMedia } from "./syncModel";\nimport { makeGuestSettings, useAccess } from "./access";\n',
              'access import',
          )

          replace_once(
              'export default function App() {\n  const [records, setRecords] = useState<EventRecord[]>([]);',
              'export default function App() {\n  const { mode: accessMode, user: accountUser, leaveGuest, signOutAndReturn } = useAccess();\n  const isGuest = accessMode === "guest";\n  const [records, setRecords] = useState<EventRecord[]>([]);',
              'app access state',
          )

          sub_once(
              r'  useEffect\(\(\) => \{\n    let mounted = true;\n    Promise\.all\(\[loadRecordsWithMigration\(\), Promise\.resolve\(readSettings\(\)\)\]\)\.then\(\(\[loadedRecords, loadedSettings\]\) => \{\n      if \(!mounted\) return;\n      setRecords\(loadedRecords\);\n      setSettings\(loadedSettings\);\n      setView\(loadedSettings\.defaultView\);\n    \}\);\n    return \(\) => \{\n      mounted = false;\n    \};\n  \}, \[\]\);',
              '''  useEffect(() => {
    let mounted = true;
    if (isGuest) {
      const guestSettings = makeGuestSettings();
      setRecords([]);
      setSettings(guestSettings);
      setView(guestSettings.defaultView);
      return () => {
        mounted = false;
      };
    }
    Promise.all([loadRecordsWithMigration(), Promise.resolve(readSettings())]).then(([loadedRecords, loadedSettings]) => {
      if (!mounted) return;
      setRecords(loadedRecords);
      setSettings(loadedSettings);
      setView(loadedSettings.defaultView);
    });
    return () => {
      mounted = false;
    };
  }, [isGuest]);''',
              'initial data load',
          )

          replace_once(
              '  useEffect(() => {\n  if (!settings.onboardingComplete) return;',
              '  useEffect(() => {\n  if (isGuest || !accountUser) return;\n  if (!settings.onboardingComplete) return;',
              'auto sync access guard',
          )
          replace_once(
              '}, [records, settings, syncRetryTick]);',
              '}, [records, settings, syncRetryTick, isGuest, accountUser]);',
              'auto sync dependencies',
          )

          replace_once(
              '  useEffect(() => {\n    if (!mediaRefreshKey || mediaRefreshKey === lastMediaRefreshKey.current) return;',
              '  useEffect(() => {\n    if (isGuest || !accountUser) return;\n    if (!mediaRefreshKey || mediaRefreshKey === lastMediaRefreshKey.current) return;',
              'media refresh access guard',
          )
          replace_once(
              '  }, [mediaRefreshKey, mediaRefreshTick]);',
              '  }, [mediaRefreshKey, mediaRefreshTick, isGuest, accountUser]);',
              'media refresh dependencies',
          )

          replace_once(
              '  useEffect(() => {\n    function requestRefresh(force: boolean) {',
              '  useEffect(() => {\n    if (isGuest || !accountUser) return;\n    function requestRefresh(force: boolean) {',
              'media wake access guard',
          )
          replace_once(
              '  }, [settings.supabase.url, settings.supabase.anonKey, settings.supabase.mediaBucket, settings.supabase.ownerKey, settings.supabase.syncMedia]);',
              '  }, [settings.supabase.url, settings.supabase.anonKey, settings.supabase.mediaBucket, settings.supabase.ownerKey, settings.supabase.syncMedia, isGuest, accountUser]);',
              'media wake dependencies',
          )

          replace_once(
              '  useEffect(() => {\n    if (hasAccountCloudConfig(settings)) {',
              '  useEffect(() => {\n    if (!isGuest && accountUser && hasAccountCloudConfig(settings)) {',
              'page view access guard',
          )
          replace_once(
              '  }, [route, settings]);',
              '  }, [route, settings, isGuest, accountUser]);',
              'page view dependencies',
          )

          replace_once(
              '''  async function persistRecord(record: EventRecord) {
    const saved = await saveRecord(record);
    setRecords((current) => sortRecords(current.filter((item) => item.id !== saved.id).concat(saved), "date-desc"));
    setEditing(null);
    setSelected(saved);
    flash("已保存");
  }''',
              '''  async function persistRecord(record: EventRecord) {
    const saved = normalizeRecord(record);
    if (!isGuest) await saveRecord(saved);
    setRecords((current) => sortRecords(current.filter((item) => item.id !== saved.id).concat(saved), "date-desc"));
    setEditing(null);
    setSelected(saved);
    flash(isGuest ? "已临时保存到本次访问" : "已保存");
  }''',
              'guest record save',
          )

          replace_once(
              '''  async function moveToTrash(record: EventRecord) {
    const saved = await saveRecord({ ...record, deletedAt: nowIso() });
    setRecords((current) => current.filter((item) => item.id !== saved.id).concat(saved));
    setSelected(null);
    flash("已移入回收站");
  }''',
              '''  async function moveToTrash(record: EventRecord) {
    const saved = normalizeRecord({ ...record, deletedAt: nowIso() });
    if (!isGuest) await saveRecord(saved);
    setRecords((current) => current.filter((item) => item.id !== saved.id).concat(saved));
    setSelected(null);
    flash("已移入回收站");
  }''',
              'guest trash',
          )

          replace_once(
              '''  async function restoreRecord(record: EventRecord) {
    const saved = await saveRecord({ ...record, deletedAt: undefined });
    setRecords((current) => current.filter((item) => item.id !== saved.id).concat(saved));
    flash("记录已恢复");
  }''',
              '''  async function restoreRecord(record: EventRecord) {
    const saved = normalizeRecord({ ...record, deletedAt: undefined });
    if (!isGuest) await saveRecord(saved);
    setRecords((current) => current.filter((item) => item.id !== saved.id).concat(saved));
    flash("记录已恢复");
  }''',
              'guest restore',
          )

          replace_once(
              '''  async function permanentlyDeleteRecord(record: EventRecord) {
    if (hasAccountCloudConfig(settings)) {
      await purgeTextBackupFromAccount(settings, record.id);
    }
    if (settings.storageMode === "supabase" && hasSupabaseConfig(settings)) {
      await purgeRecordFromSupabase(settings, record.id);
    }
    await deleteRecord(record.id);
    setRecords((current) => current.filter((item) => item.id !== record.id));
    flash("记录已永久删除");
  }''',
              '''  async function permanentlyDeleteRecord(record: EventRecord) {
    if (!isGuest) {
      if (hasAccountCloudConfig(settings)) {
        await purgeTextBackupFromAccount(settings, record.id);
      }
      if (settings.storageMode === "supabase" && hasSupabaseConfig(settings)) {
        await purgeRecordFromSupabase(settings, record.id);
      }
      await deleteRecord(record.id);
    }
    setRecords((current) => current.filter((item) => item.id !== record.id));
    flash("记录已永久删除");
  }''',
              'guest permanent delete',
          )

          replace_once(
              '''  async function updateSettings(next: AppSettings) {
    const saved = writeSettings(next);
    setSettings(saved);
    setView(saved.defaultView);
    void saveAccountProfileQuietly(saved);
    flash("设置已保存");
  }''',
              '''  async function updateSettings(next: AppSettings) {
    if (isGuest) {
      const guestBase = makeGuestSettings();
      const saved = { ...guestBase, defaultView: next.defaultView, posterColumns: next.posterColumns };
      setSettings(saved);
      setView(saved.defaultView);
      flash("访客显示设置仅对本次访问有效");
      return;
    }
    const saved = writeSettings(next);
    setSettings(saved);
    setView(saved.defaultView);
    void saveAccountProfileQuietly(saved);
    flash("设置已保存");
  }''',
              'guest settings save',
          )

          replace_once(
              '''  function updatePosterColumns(posterColumns: number) {
    const saved = writeSettings({ ...settings, posterColumns });
    setSettings(saved);
    void saveAccountProfileQuietly(saved);
  }''',
              '''  function updatePosterColumns(posterColumns: number) {
    if (isGuest) {
      setSettings((current) => ({ ...current, posterColumns }));
      return;
    }
    const saved = writeSettings({ ...settings, posterColumns });
    setSettings(saved);
    void saveAccountProfileQuietly(saved);
  }''',
              'guest poster columns',
          )

          replace_once(
              '''  async function replaceRecords(next: EventRecord[], message: string) {
    await replaceAllRecords(next);
    setRecords(sortRecords(next, "date-desc"));
    flash(message);
  }''',
              '''  async function replaceRecords(next: EventRecord[], message: string) {
    if (!isGuest) await replaceAllRecords(next);
    setRecords(sortRecords(next, "date-desc"));
    flash(message);
  }''',
              'guest replace records',
          )

          text = text.replace(
              '{isAdmin(settings) && <RouteButton',
              '{!isGuest && Boolean(accountUser) && isAdmin(settings) && <RouteButton',
          )
          text = text.replace(
              '{route === "admin" && isAdmin(settings) && (',
              '{route === "admin" && !isGuest && Boolean(accountUser) && isAdmin(settings) && (',
          )

          replace_once(
              '<small>@{settings.account.username || "local"}</small>',
              '<small>{isGuest ? "临时本地" : `@${settings.account.username || "account"}`}</small>',
              'rail account status',
          )

          replace_once(
              '<AccountChip settings={settings} syncing={syncing} conflictCount={syncConflicts.length} onClick={() => setRoute("settings")} />',
              '<AccountChip settings={settings} syncing={syncing} conflictCount={syncConflicts.length} guest={isGuest} onClick={() => isGuest ? leaveGuest() : setRoute("settings")} />',
              'account chip mode',
          )

          replace_once(
              '{syncing ? "同步中…" : syncConflicts.length > 0 ? `${syncConflicts.length} 条冲突` : storageLocationLabel(settings)}',
              '{isGuest ? "本次访问" : syncing ? "同步中…" : syncConflicts.length > 0 ? `${syncConflicts.length} 条冲突` : storageLocationLabel(settings)}',
              'sync pill guest status',
          )

          replace_once(
              '        {route === "settings" && (\n          <SettingsView',
              '        {route === "settings" && isGuest && <GuestModeView onLogin={leaveGuest} />}\n        {route === "settings" && !isGuest && (\n          <SettingsView',
              'guest settings route',
          )

          replace_once(
              '            setBusy={setBusy}\n            onRestore={restoreRecord}',
              '            setBusy={setBusy}\n            onSignOut={signOutAndReturn}\n            onRestore={restoreRecord}',
              'settings signout prop',
          )

          replace_once(
              '      {!settings.onboardingComplete && (',
              '      {!isGuest && !settings.onboardingComplete && (',
              'first run guest guard',
          )

          sub_once(
              r'function AccountChip\(\{ settings, syncing, conflictCount, onClick \}: \{ settings: AppSettings; syncing: boolean; conflictCount: number; onClick: \(\) => void \}\) \{\n  const label = accountLabel\(settings\);\n  const baseLabel = settings\.storageMode === "supabase"\n    \? hasPersonalCloudConnection\(settings\) \? "云同步已连接" : "云端待连接"\n    : hasAccountCloudConfig\(settings\) \? "文字备份中" : "仅当前设备";\n  const statusLabel = syncing \? "同步中…" : conflictCount > 0 \? `\$\{conflictCount\} 条冲突` : baseLabel;',
              '''function GuestModeView({ onLogin }: { onLogin: () => void }) {
  return (
    <section className="guest-mode-panel">
      <span className="badge">访客临时模式</span>
      <h2>本次访问不读取正式档案</h2>
      <p>当前新增、编辑和导入的数据只存在于页面内，不写入浏览器数据库，也不会连接 Live Memory 账号或个人 Supabase。刷新、关闭页面或返回登录后，这些临时数据会清空。</p>
      <div className="button-row">
        <button className="button primary" type="button" onClick={onLogin}><ShieldCheck size={18} />返回账号登录</button>
      </div>
    </section>
  );
}

function AccountChip({ settings, syncing, conflictCount, guest, onClick }: { settings: AppSettings; syncing: boolean; conflictCount: number; guest?: boolean; onClick: () => void }) {
  const label = guest ? "访客" : accountLabel(settings);
  const baseLabel = guest
    ? "临时本地数据"
    : settings.storageMode === "supabase"
      ? hasPersonalCloudConnection(settings) ? "云同步已连接" : "云端待连接"
      : hasAccountCloudConfig(settings) ? "文字备份中" : "仅当前设备";
  const statusLabel = guest ? baseLabel : syncing ? "同步中…" : conflictCount > 0 ? `${conflictCount} 条冲突` : baseLabel;''',
              'guest view and account chip',
          )

          replace_once(
              '  setBusy,\n  onRestore,',
              '  setBusy,\n  onSignOut,\n  onRestore,',
              'settings prop destructuring',
          )
          replace_once(
              '  setBusy: (value: boolean) => void;\n  onRestore:',
              '  setBusy: (value: boolean) => void;\n  onSignOut: () => Promise<void>;\n  onRestore:',
              'settings prop type',
          )

          sub_once(
              r'                <div className="button-row">\n                  <button className="button primary" disabled=\{busy \|\| !password\} type="button" onClick=\{\(\) => run\("", handleAccountLogin\)\}>.*?\n                  <button className="button ghost" type="button" onClick=\{\(\) => run\("已退出账号", async \(\) => \{ await signOut\(draft\); setUserLabel\("未登录"\); setAccountSignedIn\(false\); \}\)\}>退出</button>\n                </div>',
              '''                <div className="button-row">
                  {accountSignedIn ? (
                    <>
                      <button className="button ghost" disabled={!password || busy} type="button" onClick={() => run("密码已更新", async () => { await updateAccountPassword(draft, password); })}>更新密码</button>
                      <button className="button ghost" disabled={busy} type="button" onClick={() => setRecoveryOpen((value) => !value)}>备用邮箱重置</button>
                      <button className="button ghost" disabled={busy} type="button" onClick={() => run("", onSignOut)}>退出账号</button>
                    </>
                  ) : (
                    <>
                      <button className="button primary" disabled={busy || !password} type="button" onClick={() => run("", handleAccountLogin)}>
                        {busy ? <Loader2 className="spin" /> : <ShieldCheck size={18} />}
                        登录账号
                      </button>
                      <button className="button ghost" disabled={busy || !password} type="button" onClick={() => run("", handleAccountRegister)}>创建账号</button>
                      <button className="button ghost" disabled={busy} type="button" onClick={() => setRecoveryOpen((value) => !value)}>备用邮箱重置</button>
                      <button className="button ghost" disabled={busy} type="button" onClick={() => run("正在打开 GitHub", async () => { await signInWithGithub(draft); })}><Github size={18} />GitHub 登录</button>
                    </>
                  )}
                </div>''',
              'settings account actions',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check, test and build
        run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Commit verified integration and remove workflow
        shell: bash
        run: |
          rm -f .github/workflows/patch-access-mode.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/access.tsx src/access.css src/main.tsx .github/workflows/patch-access-mode.yml
          git commit -m "Enforce explicit account or temporary guest access"
          git push origin main
