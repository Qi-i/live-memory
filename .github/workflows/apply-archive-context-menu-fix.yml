name: Apply archive context menu feature

on:
  push:
    branches: [feat/archive-card-context-menu-20260916]
    paths:
      - scripts/apply-archive-context-menu-fix.py
      - .github/workflows/apply-archive-context-menu-fix.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/archive-card-context-menu-20260916
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply feature
        run: python scripts/apply-archive-context-menu-fix.py
      - run: npm ci
      - name: Verify feature
        run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Commit verified feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-archive-context-menu-fix.py .github/workflows/apply-archive-context-menu-fix.yml
          git add src scripts/visual-audit.mjs package.json scripts/archive-context-menu-tests.mjs
          git commit -m "Add archive card context actions and quick show duplication"
          git push origin HEAD:feat/archive-card-context-menu-20260916
