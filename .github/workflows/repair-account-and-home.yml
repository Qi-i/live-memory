          s = s.replace('if (isEmailRateLimit(error)) throw new Error("账号请求过于频繁，请稍后再试。");\n  throw new Error("用户名或密码不正确。新用户请先选择“创建新账号”。");', 'if (isEmailRateLimit(error)) throw new Error("登录尝试过于频繁，请稍后再试。");\n  if (/failed to fetch|network|connection|load failed|closed/i.test(error.message || "")) throw new Error("暂时无法连接账号服务，请刷新页面后重试。");\n  throw new Error("用户名或密码不正确。");')
