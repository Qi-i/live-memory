name: Repair account flow and public homepage

on:
  push:
    branches: [fix/account-auth-parity]
    paths: [.github/workflows/repair-account-and-home.yml]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/account-auth-parity
          fetch-depth: 2

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bundle five public demo posters
        run: |
          set -euo pipefail
          mkdir -p public/demo
          curl -L --fail --retry 3 'https://img.alicdn.com/imgextra/i3/2251059038/O1CN01DdC1Sn2GdSmcwNS5Y_!!2251059038.jpg' -o public/demo/zhou-shen.jpg
          curl -L --fail --retry 3 'https://img.alicdn.com/imgextra/i2/2251059038/O1CN01JLdVX82GdSmhDSJH7_!!2251059038.jpg' -o public/demo/xue-zhiqian.jpg
          curl -L --fail --retry 3 'https://qi-i.github.io/live-memory/assets/seen-05-9_h69jyr.jpg' -o public/demo/zhang-jie.jpg
          curl -L --fail --retry 3 'https://qi-i.github.io/live-memory/assets/seen-08-BESB_PNm.jpg' -o public/demo/wang-sulong.jpg
          curl -L --fail --retry 3 'https://qi-i.github.io/live-memory/assets/seen-14-RvmVt_qY.jpg' -o public/demo/zhao-lei.jpg
          file public/demo/*

      - name: Rewrite account entrance
        run: |
          cat > src/access.tsx <<'EOF'
          import { ArrowRight, CheckCircle2, Github, Loader2, ShieldCheck, UserRound } from "lucide-react";
          import {
            FormEvent,
            ReactNode,
            createContext,
            useContext,
            useEffect,
            useMemo,
            useState,
          } from "react";
          import { AppSettings, defaultSettings, validatePassword, validateUsername } from "./domain";
          import { readSettings, writeSettings } from "./storage";
          import {
            currentUser,
            signInWithGithub,
            signInWithPassword,
            signOut,
            signUpOnly,
            watchAccountAuth,
          } from "./supabase";

          const GUEST_SESSION_KEY = "live-memory-guest-session";

          type AccountUser = NonNullable<Awaited<ReturnType<typeof currentUser>>>;
          export type AccessMode = "loading" | "signed-out" | "guest" | "account";

          interface AccessContextValue {
            mode: AccessMode;
            user: AccountUser | null;
            enterGuest: () => void;
            leaveGuest: () => void;
            signOutAndReturn: () => Promise<void>;
          }

          const AccessContext = createContext<AccessContextValue>({
            mode: "loading",
            user: null,
            enterGuest: () => undefined,
            leaveGuest: () => undefined,
            signOutAndReturn: async () => undefined,
          });

          function userText(user: AccountUser, ...keys: string[]) {
            const metadata = (user.user_metadata || {}) as Record<string, unknown>;
            for (const key of keys) {
              const value = metadata[key];
              if (typeof value === "string" && value.trim()) return value.trim();
            }
            return "";
          }

          function validSavedUsername(value: string) {
            const normalized = value.trim().toLowerCase();
            return /^[a-z0-9]{4,32}$/.test(normalized) ? normalized : "";
          }

          function normalizedProviderUsername(value: string) {
            const normalized = value.toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 32);
            return /^[a-z0-9]{4,32}$/.test(normalized) ? normalized : "";
          }

          function settingsForSessionUser(settings: AppSettings, user: AccountUser) {
            const providerUsername = userText(user, "user_name", "preferred_username", "username")
              || user.email?.split("@")[0]
              || "";
            const username = validSavedUsername(settings.account.username)
              || normalizedProviderUsername(providerUsername)
              || "user0000";
            const nickname = userText(user, "nickname", "name", "full_name")
              || settings.account.nickname
              || providerUsername
              || username;
            const avatarUrl = userText(user, "avatar_url", "picture") || settings.account.avatarUrl;
            return writeSettings({
              ...settings,
              account: { ...settings.account, username, nickname, avatarUrl },
            });
          }

          function settingsForCredentials(username: string, nickname?: string) {
            const settings = readSettings();
            return writeSettings({
              ...settings,
              account: {
                ...settings.account,
                username: validateUsername(username),
                nickname: nickname?.trim() || settings.account.nickname || username,
              },
            });
          }

          export function AccessGate({ children }: { children: ReactNode }) {
            const [mode, setMode] = useState<AccessMode>("loading");
            const [user, setUser] = useState<AccountUser | null>(null);

            useEffect(() => {
              let active = true;

              const applyUser = (sessionUser: AccountUser | null) => {
                if (!active) return;
                if (sessionUser) {
                  sessionStorage.removeItem(GUEST_SESSION_KEY);
                  settingsForSessionUser(readSettings(), sessionUser);
                  setUser(sessionUser);
                  setMode("account");
                } else {
                  setUser(null);
                  setMode(sessionStorage.getItem(GUEST_SESSION_KEY) === "1" ? "guest" : "signed-out");
                }
              };

              const bootstrap = async () => {
                try {
                  applyUser(await currentUser(readSettings()));
                } catch {
                  applyUser(null);
                }
              };
              void bootstrap();

              let stopWatching = () => undefined;
              try {
                stopWatching = watchAccountAuth(readSettings(), (sessionUser) => {
                  window.setTimeout(() => applyUser(sessionUser), 0);
                });
              } catch {
                // The login screen stays available even when the account service is temporarily unreachable.
              }

              return () => {
                active = false;
                stopWatching();
              };
            }, []);

            const enterGuest = () => {
              sessionStorage.setItem(GUEST_SESSION_KEY, "1");
              setUser(null);
              setMode("guest");
            };

            const leaveGuest = () => {
              sessionStorage.removeItem(GUEST_SESSION_KEY);
              setUser(null);
              setMode("signed-out");
            };

            const signOutAndReturn = async () => {
              await signOut(readSettings());
              sessionStorage.removeItem(GUEST_SESSION_KEY);
              setUser(null);
              setMode("signed-out");
            };

            const contextValue = useMemo<AccessContextValue>(() => ({
              mode,
              user,
              enterGuest,
              leaveGuest,
              signOutAndReturn,
            }), [mode, user]);

            if (mode === "loading") {
              return <div className="access-loading" role="status"><Loader2 className="spin" /><span>正在打开现场记…</span></div>;
            }

            if (mode === "signed-out") {
              return (
                <AccessContext.Provider value={contextValue}>
                  <LoginGate
                    onGuest={enterGuest}
                    onGithub={() => signInWithGithub(readSettings()).then(() => undefined)}
                    onLogin={async (username, password) => {
                      validatePassword(password);
                      const settings = settingsForCredentials(username);
                      await signInWithPassword(settings, password);
                      const sessionUser = await currentUser(settings);
                      if (!sessionUser) throw new Error("登录没有完成，请刷新页面后再试。");
                      settingsForSessionUser(settings, sessionUser);
                      setUser(sessionUser);
                      setMode("account");
                    }}
                    onRegister={async (nickname, username, password) => {
                      if (!nickname.trim()) throw new Error("请填写昵称。");
                      validatePassword(password);
                      const settings = settingsForCredentials(username, nickname);
                      await signUpOnly(settings, password);
                      const sessionUser = await currentUser(settings);
                      if (!sessionUser) throw new Error("账号已经创建，但登录没有完成，请刷新后再试。");
                      settingsForSessionUser(settings, sessionUser);
                      setUser(sessionUser);
                      setMode("account");
                    }}
                  />
                </AccessContext.Provider>
              );
            }

            return <AccessContext.Provider value={contextValue}>{children}</AccessContext.Provider>;
          }

          const demoCards = [
            ["zhou-shen.jpg", "周深", "郑州"],
            ["xue-zhiqian.jpg", "薛之谦", "洛阳"],
            ["zhang-jie.jpg", "张杰", "乌鲁木齐"],
            ["wang-sulong.jpg", "汪苏泷", "郑州"],
            ["zhao-lei.jpg", "赵雷", "西安"],
          ] as const;

          function demoAsset(file: string) {
            return `${import.meta.env.BASE_URL}demo/${file}`;
          }

          function accessMessage(error: unknown) {
            const message = error instanceof Error ? error.message : String(error || "");
            if (/failed to fetch|network|connection|load failed|closed/i.test(message)) {
              return "暂时无法连接账号服务。请刷新页面后重试；访客示例仍可正常查看。";
            }
            if (/invalid login credentials|用户名或密码/i.test(message)) return "用户名或密码不正确。";
            return message || "操作没有完成，请稍后重试。";
          }

          function LoginGate({
            onGuest,
            onGithub,
            onLogin,
            onRegister,
          }: {
            onGuest: () => void;
            onGithub: () => Promise<void>;
            onLogin: (username: string, password: string) => Promise<void>;
            onRegister: (nickname: string, username: string, password: string) => Promise<void>;
          }) {
            const [registering, setRegistering] = useState(false);
            const [nickname, setNickname] = useState("");
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [busy, setBusy] = useState(false);
            const [message, setMessage] = useState("");

            async function run(action: () => Promise<void>) {
              setBusy(true);
              setMessage("");
              try {
                await action();
              } catch (error) {
                setMessage(accessMessage(error));
              } finally {
                setBusy(false);
              }
            }

            function submit(event: FormEvent) {
              event.preventDefault();
              void run(() => registering
                ? onRegister(nickname, username, password)
                : onLogin(username, password));
            }

            return (
              <main className="access-shell">
                <section className="access-showcase" aria-label="示例演出记录">
                  <header className="access-brand-line">
                    <span className="access-logo">演</span>
                    <div><strong>现场记</strong><small>演出记录 · 票根收藏</small></div>
                  </header>

                  <div className="access-copy">
                    <span>把每次现场留在这里</span>
                    <h1>整理演出、海报、票根和照片。</h1>
                    <p>按时间、城市和艺人查看自己的观演记录，也可以生成适合分享的图片。</p>
                  </div>

                  <div className="access-poster-wall">
                    {demoCards.map(([file, artist, city], index) => (
                      <figure key={file} className={`access-poster-card poster-${index + 1}`}>
                        <img src={demoAsset(file)} alt={`${artist}演出海报`} />
                        <figcaption><strong>{artist}</strong><span>{city}</span></figcaption>
                      </figure>
                    ))}
                  </div>

                  <div className="access-benefits">
                    <span><CheckCircle2 />多种档案视图</span>
                    <span><CheckCircle2 />票根与照片分类保存</span>
                    <span><CheckCircle2 />可选个人云端同步</span>
                  </div>
                </section>

                <section className="access-card">
                  <header>
                    <span>{registering ? "创建账号" : "欢迎回来"}</span>
                    <h2>{registering ? "创建现场记账号" : "登录现场记"}</h2>
                    <p>{registering ? "创建后可保存个人资料，并按需连接自己的 Supabase。" : "使用之前创建的用户名和密码，或直接使用 GitHub。"}</p>
                  </header>

                  <form onSubmit={submit}>
                    {registering && (
                      <label><span>昵称</span><input value={nickname} onChange={(event) => setNickname(event.target.value)} placeholder="页面上显示的名字" autoComplete="nickname" /></label>
                    )}
                    <label><span>用户名</span><input value={username} onChange={(event) => setUsername(event.target.value.toLowerCase().replace(/[^a-z0-9]/g, ""))} placeholder="4–32 位英文字母或数字" autoComplete="username" /></label>
                    <label><span>密码</span><input type="password" value={password} onChange={(event) => setPassword(event.target.value)} placeholder="至少 8 位" autoComplete={registering ? "new-password" : "current-password"} /></label>
                    {message && <p className="access-error" role="alert">{message}</p>}
                    <button className="access-primary" disabled={busy || !username || !password || (registering && !nickname)} type="submit">
                      {busy ? <Loader2 className="spin" /> : <ShieldCheck />}{registering ? "创建并登录" : "登录"}
                    </button>
                  </form>

                  <div className="access-divider"><span>或</span></div>
                  <button className="access-github" disabled={busy} type="button" onClick={() => void run(onGithub)}><Github />使用 GitHub 登录</button>

                  <button className="access-switch" type="button" onClick={() => { setRegistering((value) => !value); setMessage(""); }}>
                    {registering ? "已有账号，返回登录" : "第一次使用？创建账号"}
                  </button>

                  <div className="access-guest">
                    <div><UserRound /><span><strong>先看看示例</strong><small>内置 5 条公开演出示例；你的修改不会保存，也不会读取个人记录。</small></span></div>
                    <button type="button" onClick={onGuest}>进入示例<ArrowRight /></button>
                  </div>

                  <p className="access-footnote">登录账号用于识别你；只有主动连接个人 Supabase 后，图片才会跨设备同步。</p>
                </section>
              </main>
            );
          }

          export function useAccess() {
            return useContext(AccessContext);
          }

          export function isGuestSession() {
            return sessionStorage.getItem(GUEST_SESSION_KEY) === "1";
          }

          export function makeGuestSettings(): AppSettings {
            return {
              ...defaultSettings,
              onboardingComplete: true,
              storageMode: "local",
              account: { username: "guest", nickname: "访客", avatarUrl: "", recoveryEmail: "" },
              supabase: { url: "", anonKey: "", mediaBucket: "echo-media", syncMedia: false, ownerKey: "" },
            };
          }
          EOF

          cat > src/access.css <<'EOF'
          .access-loading,
          .access-shell { min-height: 100vh; }

          .access-loading {
            display: grid;
            place-items: center;
            align-content: center;
            gap: 12px;
            color: #1a1d22;
            background: #f3f2ed;
            font-weight: 800;
          }

          .access-loading svg { width: 28px; height: 28px; }

          .access-shell {
            display: grid;
            grid-template-columns: minmax(0, 1.18fr) minmax(390px, .82fr);
            gap: clamp(18px, 3vw, 42px);
            align-items: center;
            padding: clamp(18px, 3vw, 46px);
            color: #171a1f;
            background:
              radial-gradient(circle at 9% 10%, rgba(205, 234, 103, .28), transparent 24%),
              radial-gradient(circle at 82% 90%, rgba(108, 185, 188, .18), transparent 26%),
              #f3f2ed;
          }

          .access-showcase {
            position: relative;
            min-height: calc(100vh - clamp(36px, 6vw, 92px));
            overflow: hidden;
            padding: clamp(26px, 4vw, 58px);
            border: 1px solid rgba(23, 26, 31, .1);
            border-radius: 28px;
            background: #171a1f;
            box-shadow: 0 28px 70px rgba(22, 25, 31, .18);
            color: #f8f6ef;
          }

          .access-showcase::after {
            content: "";
            position: absolute;
            inset: auto -12% -25% 34%;
            height: 56%;
            border-radius: 50%;
            background: rgba(205, 234, 103, .14);
            filter: blur(30px);
            pointer-events: none;
          }

          .access-brand-line { display: flex; align-items: center; gap: 13px; position: relative; z-index: 2; }
          .access-logo {
            display: grid;
            width: 52px;
            height: 52px;
            place-items: center;
            border-radius: 15px;
            color: #171a1f;
            background: #d7f05a;
            font-size: 25px;
            font-weight: 950;
          }
          .access-brand-line div { display: grid; gap: 2px; }
          .access-brand-line strong { font-size: 21px; }
          .access-brand-line small { color: rgba(248, 246, 239, .58); font-weight: 700; }

          .access-copy { position: relative; z-index: 2; max-width: 650px; margin-top: clamp(48px, 8vh, 92px); }
          .access-copy > span { color: #d7f05a; font-size: 13px; font-weight: 900; letter-spacing: .08em; }
          .access-copy h1 { margin: 12px 0 15px; max-width: 620px; font-size: clamp(38px, 5vw, 66px); line-height: 1.05; letter-spacing: -.045em; }
          .access-copy p { margin: 0; max-width: 560px; color: rgba(248, 246, 239, .67); font-size: 17px; font-weight: 650; line-height: 1.7; }

          .access-poster-wall {
            position: absolute;
            right: clamp(24px, 4vw, 66px);
            bottom: clamp(82px, 10vh, 118px);
            display: grid;
            grid-template-columns: repeat(5, minmax(82px, 132px));
            gap: clamp(9px, 1.2vw, 15px);
            width: min(73%, 760px);
            align-items: end;
            z-index: 2;
          }

          .access-poster-card {
            position: relative;
            margin: 0;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 16px;
            background: #252a31;
            box-shadow: 0 18px 32px rgba(0, 0, 0, .28);
          }
          .access-poster-card:nth-child(2), .access-poster-card:nth-child(4) { transform: translateY(28px); }
          .access-poster-card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
          .access-poster-card figcaption { position: absolute; inset: auto 0 0; display: grid; gap: 1px; padding: 18px 9px 9px; background: linear-gradient(transparent, rgba(0,0,0,.82)); }
          .access-poster-card figcaption strong { font-size: 12px; }
          .access-poster-card figcaption span { color: rgba(255,255,255,.65); font-size: 10px; }

          .access-benefits { position: absolute; left: clamp(26px, 4vw, 58px); bottom: 34px; display: flex; flex-wrap: wrap; gap: 14px 22px; z-index: 2; }
          .access-benefits span { display: inline-flex; align-items: center; gap: 7px; color: rgba(248,246,239,.7); font-size: 12px; font-weight: 750; }
          .access-benefits svg { width: 15px; height: 15px; color: #d7f05a; }

          .access-card {
            width: min(480px, 100%);
            justify-self: center;
            padding: clamp(27px, 4vw, 43px);
            border: 1px solid rgba(23, 26, 31, .1);
            border-radius: 24px;
            background: rgba(255, 255, 252, .96);
            box-shadow: 0 22px 54px rgba(29, 34, 40, .12);
          }

          .access-card header > span { color: #748b16; font-size: 12px; font-weight: 900; letter-spacing: .08em; }
          .access-card h2 { margin: 8px 0 0; font-size: clamp(30px, 4vw, 40px); line-height: 1.12; letter-spacing: -.03em; }
          .access-card header p { margin: 11px 0 23px; color: #68717b; font-size: 14px; font-weight: 650; line-height: 1.6; }
          .access-card form { display: grid; gap: 11px; }
          .access-card form label { display: grid; gap: 7px; padding: 11px 13px; border: 1px solid #deded8; border-radius: 12px; background: #fff; }
          .access-card form label:focus-within { border-color: #93aa32; box-shadow: 0 0 0 3px rgba(183, 208, 76, .18); }
          .access-card form label > span { color: #68717b; font-size: 12px; font-weight: 850; }
          .access-card input { width: 100%; min-width: 0; border: 0; outline: 0; color: #171a1f; background: transparent; font: inherit; font-weight: 750; }

          .access-primary, .access-github, .access-guest button, .access-switch { border: 0; font: inherit; font-weight: 850; cursor: pointer; }
          .access-primary, .access-github { display: inline-flex; width: 100%; min-height: 48px; align-items: center; justify-content: center; gap: 9px; border-radius: 12px; }
          .access-primary { margin-top: 3px; color: #171a1f; background: #d7f05a; }
          .access-primary:hover { background: #cbe34f; }
          .access-github { color: #fff; background: #171a1f; }
          .access-primary svg, .access-github svg, .access-guest svg { width: 18px; height: 18px; }
          .access-primary:disabled, .access-github:disabled { cursor: not-allowed; opacity: .55; }

          .access-error { margin: 0; padding: 10px 12px; border-radius: 10px; color: #8a3044; background: #fde9ed; font-size: 13px; font-weight: 750; line-height: 1.45; }
          .access-divider { display: flex; align-items: center; gap: 10px; margin: 15px 0; color: #9a9fa6; font-size: 12px; }
          .access-divider::before, .access-divider::after { content: ""; height: 1px; flex: 1; background: #e2e2dc; }
          .access-switch { display: block; margin: 14px auto 18px; color: #596b13; background: transparent; }

          .access-guest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 13px; align-items: center; padding: 14px; border: 1px solid #dcded0; border-radius: 14px; background: #f7f8f0; }
          .access-guest > div { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; align-items: center; }
          .access-guest span { display: grid; gap: 3px; }
          .access-guest small { color: #747b84; font-size: 11px; font-weight: 650; line-height: 1.45; }
          .access-guest button { display: inline-flex; min-height: 38px; align-items: center; gap: 5px; padding: 0 11px; border-radius: 9px; color: #171a1f; background: #fff; box-shadow: inset 0 0 0 1px #d8d9d3; }
          .access-footnote { margin: 15px 2px 0; color: #858b92; font-size: 11px; font-weight: 650; line-height: 1.55; }

          @media (max-width: 1120px) {
            .access-shell { grid-template-columns: 1fr; }
            .access-showcase { min-height: 650px; }
            .access-card { width: min(620px, 100%); }
          }

          @media (max-width: 720px) {
            .access-shell { gap: 12px; padding: 10px; }
            .access-showcase, .access-card { border-radius: 18px; }
            .access-showcase { min-height: 470px; padding: 23px; }
            .access-copy { margin-top: 40px; }
            .access-copy h1 { font-size: 38px; }
            .access-copy p { font-size: 14px; }
            .access-poster-wall { right: 18px; bottom: 72px; width: calc(100% - 36px); grid-template-columns: repeat(5, 1fr); gap: 7px; }
            .access-poster-card { border-radius: 9px; }
            .access-poster-card:nth-child(2), .access-poster-card:nth-child(4) { transform: translateY(14px); }
            .access-poster-card figcaption { display: none; }
            .access-benefits { left: 22px; bottom: 22px; gap: 8px 14px; }
            .access-benefits span { font-size: 10px; }
            .access-card { padding: 23px; }
            .access-guest { grid-template-columns: 1fr; }
            .access-guest button { justify-content: center; }
          }
          EOF

      - name: Replace guest demo data with five public concert examples
        run: |
          cat > src/seeds.ts <<'EOF'
          import { EventRecord, MediaAsset, createId } from "./domain";
          import { makeMedia, nowIso } from "./media";

          type SeedInput = Omit<EventRecord, "schemaVersion" | "media" | "lineup" | "favorite" | "createdAt" | "updatedAt"> & { poster?: string };

          function demoAsset(file: string) {
            return `${import.meta.env.BASE_URL}demo/${file}`;
          }

          function seedRecord(input: SeedInput): EventRecord {
            const timestamp = "2026-08-01T00:00:00.000Z";
            const media: MediaAsset[] = input.poster
              ? [makeMedia(input.id, "poster", input.poster, "演出海报", "sample")]
              : [];
            return {
              ...input,
              schemaVersion: 2,
