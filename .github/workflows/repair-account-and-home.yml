          marker = 'function mediaPathFingerprint(records: EventRecord[]) {\n  return records.flatMap((record) => record.media.filter((asset) => asset.storagePath).map((asset) => `${record.id}:${asset.id}:${asset.storagePath}`)).join("|");\n}\n'
          helper = marker + '\nfunction guestDemoRecords(): EventRecord[] {\n  return seedRecords.map((record) => ({\n    ...record,\n    artists: [...record.artists],\n    lineup: record.lineup.map((item) => ({ ...item })),\n    media: record.media.map((asset) => ({ ...asset })),\n    companions: [...record.companions],\n    tags: [...record.tags],\n    setlist: [...record.setlist],\n    colors: [...record.colors],\n  }));\n}\n'
          if marker not in s: raise SystemExit('appController helper marker missing')
          s = s.replace(marker, helper)
          s = re.sub(r'  useEffect\(\(\) => \{\n    let active = true;\n    initialized\.current = false;.*?\n  \}, \[access\.mode, access\.user, isGuest\]\);', '''  useEffect(() => {
    let active = true;
    initialized.current = false;

    if (isGuest) {
      const demoRecords = guestDemoRecords();
      const guestSettings = makeGuestSettings();
      recordsRef.current = demoRecords;
      setRecordState(demoRecords);
      setSettings(guestSettings);
      lastSyncFingerprint.current = recordFingerprint(demoRecords);
      initialized.current = true;
      return () => { active = false; };
    }

    Promise.all([loadRecordsWithMigration(), Promise.resolve(readSettings())])
      .then(async ([loadedRecords, loadedSettings]) => {
        let nextRecords = loadedRecords;
        let nextSettings = loadedSettings;
        if (access.user) {
          try {
            const initialSync = await syncAfterLogin({ ...loadedSettings, onboardingComplete: true }, loadedRecords);
            nextRecords = initialSync.records;
            nextSettings = writeSettings({ ...initialSync.settings, onboardingComplete: true });
            await replaceAllRecords(nextRecords);
          } catch {
            nextSettings = writeSettings({ ...loadedSettings, onboardingComplete: true });
          }
        }
        if (!active) return;
        recordsRef.current = nextRecords;
        setRecordState(nextRecords);
        setSettings(nextSettings);
        lastSyncFingerprint.current = recordFingerprint(nextRecords);
        initialized.current = true;
      })
      .catch((error) => {
        if (!active) return;
        setToast(friendlySupabaseErrorMessage(error, "本机记录加载失败"));
        initialized.current = true;
      });
    return () => { active = false; };
  }, [access.mode, access.user, isGuest]);''', s, flags=re.S)

          s = re.sub(r'  async function persistRecord\(record: EventRecord\) \{.*?\n  \}', '''  async function persistRecord(record: EventRecord) {
