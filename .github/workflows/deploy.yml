name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Build V3 standalone preview"]
    types: [completed]
    branches: [refactor/core-v3-architecture-20261108]

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build application
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Attach verified V3 demo without changing production app
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TYPE: ${{ github.event_name }}
          TRIGGER_RUN: ${{ github.event.workflow_run.id }}
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          source_run=""
          if [ "$EVENT_TYPE" = "workflow_run" ]; then
            source_run="$TRIGGER_RUN"
          else
            source_run="$(gh run list --workflow v3-preview.yml --branch refactor/core-v3-architecture-20261108 --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)"
          fi
          if [ -z "$source_run" ]; then
            echo "No approved V3 standalone preview artifact yet; production V2 stays available."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/v3-preview"
          if ! gh run download "$source_run" --name v3-static-preview --dir "$RUNNER_TEMP/v3-preview"; then
            if [ "$EVENT_TYPE" = "workflow_run" ]; then
              echo "V3 preview build claimed success but its artifact is missing" >&2
              exit 1
            fi
            echo "Latest V3 artifact not available. Leaving existing production app unchanged."
            exit 0
          fi
          test -f "$RUNNER_TEMP/v3-preview/index.html"
          test -f "$RUNNER_TEMP/v3-preview/preview-info.json"
          if [ "$EVENT_TYPE" = "workflow_run" ]; then
            node -e '
              const fs=require("fs");
              const manifest=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
              if (manifest.sha !== process.argv[2] || manifest.type !== "demo-only") process.exit(1);
            ' "$RUNNER_TEMP/v3-preview/preview-info.json" "$TRIGGER_SHA"
          fi
          mkdir -p dist/v3-preview
          cp -a "$RUNNER_TEMP/v3-preview/." dist/v3-preview/
          echo "V3 isolated preview artifact from Actions run $source_run attached under /v3-preview/"

      - name: Write deployment build info
        shell: bash
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/build-info.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live deployment SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    env:
      EXPECTED_SHA: ${{ github.sha }}
      LIVE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Wait for the deployed SHA
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${LIVE_URL%/}/build-info.json"
          actual_sha=""
          body=""
          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "${endpoint}?expected=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            actual_sha="$(printf '%s' "$body" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(input).sha || ""); }
                catch { process.stdout.write(""); }
              });
            ')"
            if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            sleep 5
          done
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected $EXPECTED_SHA but the live endpoint returned: $body" >&2
            exit 1
          fi
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node -e '
            const fs = require("fs");
            const [sha, verifiedAt, url] = process.argv.slice(1);
            fs.writeFileSync("/tmp/live-deployment-status.json", JSON.stringify({ sha, verifiedAt, url, status: "verified" }, null, 2) + "\n");
          ' "$EXPECTED_SHA" "$verified_at" "$LIVE_URL"

      - name: Verify independently published V3 demo
        if: github.event_name == 'workflow_run'
        shell: bash
        env:
          PREVIEW_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          endpoint="${LIVE_URL%/}/v3-preview/preview-info.json"
          for attempt in $(seq 1 40); do
            current="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${endpoint}?sha=${PREVIEW_SHA}&attempt=${attempt}" || true)"
            received="$(printf '%s' "$current" | node -e '
              let s=""; process.stdin.on("data",x=>s+=x);
              process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(s).sha||"")}catch{}});
            ')"
            if [ "$received" = "$PREVIEW_SHA" ]; then
              echo "Public V3 preview verified at ${LIVE_URL%/}/v3-preview/ for $PREVIEW_SHA"
              exit 0
            fi
            sleep 5
          done
          echo "V3 preview did not reach its requested SHA: ${PREVIEW_SHA}" >&2
          exit 1

      - name: Publish verification record
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update deployment-status branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deployment-status-write
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/live-deployment-status.json latest.json
          git add latest.json
          git commit -m "Record verified deployment ${EXPECTED_SHA}"
          git push --force origin HEAD:deployment-status
