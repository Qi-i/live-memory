name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

      - name: Write deployment build info
        shell: bash
        run: |
          printf '{"sha":"%s","builtAt":"%s"}\n' "$GITHUB_SHA" "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > dist/build-info.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: Verify live deployment SHA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: deploy
    env:
      EXPECTED_SHA: ${{ github.sha }}
      LIVE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Wait for the deployed SHA
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${LIVE_URL%/}/build-info.json"
          actual_sha=""
          body=""
          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --location --max-time 15 \
              -H 'Cache-Control: no-cache' \
              "${endpoint}?expected=${EXPECTED_SHA}&attempt=${attempt}" || true)"
            actual_sha="$(printf '%s' "$body" | node -e '
              let input = "";
              process.stdin.on("data", chunk => input += chunk);
              process.stdin.on("end", () => {
                try { process.stdout.write(JSON.parse(input).sha || ""); }
                catch { process.stdout.write(""); }
              });
            ')"
            if [ "$actual_sha" = "$EXPECTED_SHA" ]; then
              break
            fi
            sleep 5
          done
          if [ "$actual_sha" != "$EXPECTED_SHA" ]; then
            echo "Expected $EXPECTED_SHA but the live endpoint returned: $body" >&2
            exit 1
          fi
          verified_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node -e '
            const fs = require("fs");
            const [sha, verifiedAt, url] = process.argv.slice(1);
            fs.writeFileSync("/tmp/live-deployment-status.json", JSON.stringify({ sha, verifiedAt, url, status: "verified" }, null, 2) + "\n");
          ' "$EXPECTED_SHA" "$verified_at" "$LIVE_URL"

      - name: Publish verification record
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update deployment-status branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan deployment-status-write
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/live-deployment-status.json latest.json
          git add latest.json
          git commit -m "Record verified deployment ${EXPECTED_SHA}"
          git push --force origin HEAD:deployment-status
