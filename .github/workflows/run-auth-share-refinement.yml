name: Run auth and share refinement

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  refine:
    if: github.event.issue.title == '[automation] refine auth and share studio'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/auth-share-studio-v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply refinements
        run: node scripts/refine-auth-share.mjs
      - run: npm ci
      - run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Commit refined implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/supabase.ts src/archive.tsx src/archive.css docs/deployment.md
          git commit -m "Refine OAuth callback, archive masthead and share studio"
          git push origin HEAD:fix/auth-share-studio-v2
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --comment "Refinement workflow completed."
