name: Apply account and homepage repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
  VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/account-auth-parity
          fetch-depth: 2
          token: ${{ github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Bundle five demo posters
        run: |
          set -euo pipefail
          mkdir -p public/demo
          curl -L --fail --retry 3 'https://img.alicdn.com/imgextra/i3/2251059038/O1CN01DdC1Sn2GdSmcwNS5Y_!!2251059038.jpg' -o public/demo/zhou-shen.webp
          curl -L --fail --retry 3 'https://img.alicdn.com/imgextra/i2/2251059038/O1CN01JLdVX82GdSmhDSJH7_!!2251059038.jpg' -o public/demo/xue-zhiqian.webp

          owner_key='0941992329cd3a6274552595ad64c473b21de0999ceba494b7b8708cfc4cfa17'
          download_private() {
            object_path="$1"
            output_path="$2"
            response="$(curl --silent --show-error --fail --request POST \
              "$VITE_ACCOUNT_SUPABASE_URL/storage/v1/object/sign/echo-media/$object_path" \
              --header "apikey: $VITE_ACCOUNT_SUPABASE_ANON_KEY" \
              --header "Authorization: Bearer $VITE_ACCOUNT_SUPABASE_ANON_KEY" \
              --header "x-live-memory-owner-key: $owner_key" \
              --header 'Content-Type: application/json' \
              --data '{"expiresIn":900}')"
            signed_url="$(printf '%s' "$response" | jq -r '.signedURL // .signedUrl // empty')"
            test -n "$signed_url"
            curl -L --fail --retry 3 "$VITE_ACCOUNT_SUPABASE_URL/storage/v1$signed_url" -o "$output_path"
          }

          download_private "$owner_key/seen-shot-20260618-05/media-bc085035-781f-4c23-bd1c-05ed1131e37a.jpg" public/demo/zhang-jie.jpg
          download_private "$owner_key/seen-shot-20260618-08/media-9d21cb89-5492-4e2d-ac4a-bcfd4bbabbd5.jpg" public/demo/wang-sulong.jpg
          download_private "$owner_key/seen-shot-20260618-14/media-32d6c7d4-6abd-4f88-b1ed-29cdc4c9c8d3.png" public/demo/zhao-lei.png
          file public/demo/*

      - name: Apply source repair
        run: |
          python scripts/repair_account_home.py
          sed -i 's/请先登录 Live Memory 账号/请先登录现场记账号/g' src/supabase.ts
          sed -i 's/let stopWatching = () => undefined;/let stopWatching: () => void = () => undefined;/' src/access.tsx

      - name: Verify application
        run: |
          npm ci
          npm run check

      - name: Commit verified repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src public index.html scripts
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Repair account access, guest examples and homepage'
          git push origin fix/account-auth-parity
