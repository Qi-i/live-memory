name: Humanize remaining user-facing copy

on:
  push:
    branches: [fix/account-auth-parity]
    paths: [.github/workflows/humanize-copy-once.yml]

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/account-auth-parity
          token: ${{ github.token }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Replace remaining internal or stylized phrases
        run: |
          python <<'PY'
          from pathlib import Path

          replacements = {
            '我的现场回响': '我的演出记录',
            '现场记 · Live Memory': '现场记 · 演出记录',
            '现场记忆': '演出记录',
            '云图待刷新': '图片正在重新加载',
            '还没有匹配的演出': '没有找到符合条件的演出',
            '添加新的演出记录。': '新增一条演出记录。',
          }
          for path in Path('src').glob('*.tsx'):
            text = path.read_text(encoding='utf-8')
            for old, new in replacements.items():
              text = text.replace(old, new)
            path.write_text(text, encoding='utf-8')

          banned = [
            '明确身份',
            '正式档案没有被读取',
            '不接触正式档案',
            '应用入口统一管理',
            '我的现场回响',
            'LIVE MEMORY SAMPLE',
            '云图待刷新',
          ]
          for path in Path('src').glob('*.tsx'):
            text = path.read_text(encoding='utf-8')
            for phrase in banned:
              if phrase in text:
                raise SystemExit(f'User-facing internal phrase remains in {path}: {phrase}')
          PY
      - run: npm ci
      - run: npm run check
        env:
          VITE_ACCOUNT_SUPABASE_URL: ${{ vars.VITE_ACCOUNT_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          VITE_ACCOUNT_SUPABASE_ANON_KEY: ${{ vars.VITE_ACCOUNT_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      - name: Commit copy cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          git commit -m 'Humanize remaining user-facing copy'
          git push origin fix/account-auth-parity
