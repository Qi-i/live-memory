name: Patch persistent media cache

on:
  push:
    branches: [fix/persistent-media-cache]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[media-cache-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/persistent-media-cache
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/apply-media-cache.mjs
      - run: npm run check
      - name: Commit media cache integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/supabase.ts src/appController.ts src/archive.tsx src/shareStudio.tsx scripts/run-tests.mjs
          git commit -m "Integrate persistent media cache [media-cache-applied]"
          git push origin HEAD:fix/persistent-media-cache
