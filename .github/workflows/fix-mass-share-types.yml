name: Fix mass share TypeScript compatibility

on:
  pull_request_target:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'design/portrait-banner-mass-share'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Qi-i/live-memory
          ref: design/portrait-banner-mass-share
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fix-mass-share-types.mjs
      - run: npm run check
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shareStudio.tsx
          git commit -m "Fix mass share TypeScript compatibility"
          git push origin HEAD:design/portrait-banner-mass-share
