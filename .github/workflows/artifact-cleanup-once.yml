name: One-time Actions artifact cleanup

on:
  push:
    branches:
      - maintenance/clean-actions-artifacts-20261011
    paths:
      - .github/workflows/artifact-cleanup-once.yml

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Delete superseded CI preview artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Keep latest artifacts and remove old previews
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const rules = [{"prefix":"live-memory-visual-audit","mode":"exact","keep":3}];
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { owner, repo, per_page: 100 });
            const cutoff = Date.now() - 24 * 3600 * 1000;
            const report = {
              repository: owner + '/' + repo,
              timestamp: new Date().toISOString(),
              totalArtifactsBefore: artifacts.length,
              deleted: [],
              preservedByRule: {},
              unknownAndPagesPreserved: 0,
              errors: []
            };
            const recognized = new Set();
            for (const rule of rules) {
              const matching = artifacts.filter(a => !a.expired && (
                rule.mode === 'exact' ? a.name === rule.prefix : a.name.startsWith(rule.prefix)
              )).sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
              const retained = [];
              for (const [index, a] of matching.entries()) {
                recognized.add(a.id);
                if (index < rule.keep || new Date(a.created_at).getTime() >= cutoff) {
                  retained.push({id:a.id,name:a.name});
                  continue;
                }
                try {
                  await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
                  report.deleted.push({ id:a.id, name:a.name, bytes:a.size_in_bytes||0 });
                } catch (e) {
                  report.errors.push({id:a.id,name:a.name,message:e.message});
                  core.warning('Cannot delete ' + a.name + ': ' + e.message);
                }
              }
              report.preservedByRule[rule.prefix] = retained;
            }
            report.unknownAndPagesPreserved = artifacts.filter(a => !recognized.has(a.id)).length;
            report.deletedCount = report.deleted.length;
            report.deletedBytes = report.deleted.reduce((sum,a)=>sum+a.bytes,0);
            report.deletedMiB = Math.round(report.deletedBytes/1048576*10)/10;
            const reportPath = '.github/actions-artifact-cleanup-result-20261011.json';
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: reportPath,
              message: 'chore: record one-time Actions artifact cleanup results',
              content: Buffer.from(JSON.stringify(report,null,2)+'\n','utf8').toString('base64'),
              branch: context.ref.replace('refs/heads/','')
            });
            await core.summary.addHeading('One-time artifact cleanup')
              .addRaw('Deleted '+report.deletedCount+' files, '+report.deletedMiB+' MiB. ')
              .addRaw('Unknown artifacts and Pages deployments were not touched. ')
              .addRaw('See '+reportPath+' for the itemized report.').write();
            if (report.errors.length) core.setFailed('Some artifact deletions failed; see report.');
